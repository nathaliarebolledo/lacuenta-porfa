name: Supabase keep-alive

# El plan free de Supabase pausa proyectos sin actividad de API por ~7 días.
# Este workflow hace una consulta liviana a la base de datos todos los días
# para que nunca quede "inactivo" y el deploy en Vercel siga funcionando.
#
# Requiere dos secrets en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       → https://<proyecto>.supabase.co
#   SUPABASE_ANON_KEY  → la anon/publishable key
#
# Ojo: en repos públicos GitHub desactiva los workflows programados tras
# 60 días sin commits. Si llega el correo de aviso, reactivarlo en Actions.

on:
  schedule:
    - cron: '0 12 * * *' # todos los días a las 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Falta el secret SUPABASE_URL"
            missing=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta el secret SUPABASE_ANON_KEY"
            missing=1
          fi
          exit $missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Consultar la base de datos
        run: |
          # Consulta real a una tabla (con RLS el anon recibe [] pero la query
          # igual llega a Postgres y cuenta como actividad).
          status=$(curl -s -o response.txt -w "%{http_code}" --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || status=000
          echo "Supabase respondió con status $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase no respondió OK (status $status). Si es 000, el proyecto puede estar pausado: restaurarlo en supabase.com/dashboard"
            cat response.txt 2>/dev/null || true
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
