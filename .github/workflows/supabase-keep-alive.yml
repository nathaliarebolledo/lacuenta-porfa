name: Supabase keep-alive

# El plan free de Supabase pausa proyectos sin actividad de API por ~7 días.
# Este workflow le pega un ping liviano cada pocos días para que nunca
# quede "inactivo" y el deploy en Vercel siga funcionando.

on:
  schedule:
    - cron: '0 12 */3 * *' # cada 3 días a las 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Supabase respondió con status $status"
          if [ "$status" -ge 500 ]; then
            echo "::error::Supabase no respondió correctamente (status $status)"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
